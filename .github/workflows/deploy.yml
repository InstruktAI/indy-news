name: Deploy

on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v7
      - name: Deploy via curl
        run: |
          curl -v 'https://${{ secrets.API_HOST }}/update-upstream/indy-news/indy-news-app' -H 'Authorization: Bearer ${{ secrets.API_KEY }}'
          echo "Deployed"
